[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# include commit hash in local version; add date if dirty
local_scheme = "node-and-date"
#write_to = "molscore/_version.py"
#write_to_template = "__version__ = \"{version}\"\n"

[project]
name = "MolScore"
authors = [
  { name="Morgan Thomas", email="morganthomas263@gmail.com" },
]
description = "A scoring, benchmarking and evaluation framework for goal directed generative models"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "rdkit >= 2019.03.2",
    "dask",
    "dask-jobqueue",
    "torch",
    "levenshtein",
    "streamlit-plotly-events == 0.0.6",
    "streamlit >= 1.11.0",
    "molbloom",
    "func_timeout",
    "flask"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/MorganCThomas/MolScore"
Issues = "https://github.com/MorganCThomas/MolScore/issues"

[project.scripts]
molscore_config = "molscore.gui.launcher:run_config"
molscore_monitor = "molscore.gui.launcher:run_monitor"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["molscore*", "moleval*"]
# Prevent any inclusion in the wheel
exclude = [
    "datasets*",
    "tutorials*",
    "molscore.tests*",
    "moleval.tests*",
    "**/deprecated*"
]

[tool.setuptools.package-data]
# This replaces your package_data dictionary from setup.py
molscore = [
    "data/sample.smi",
    "data/sample.bloom",
    "data/models/**/*",
    "data/structures/**/*",
    "configs/**/*",
    "scoring_functions/gypsum_dl/**/*",
    "gui/config.py",
    "gui/monitor.py"
]
moleval = [
    "metrics/mcf.csv",
    "metrics/wehi_pains.csv",
    "metrics/quality_filters/alert_collection.csv",
    "metrics/quality_filters/guacamol_rules.json",
    "metrics/NP_Score/publicnp.model.gz",
    "metrics/SA_Score/fpscores.pkl.gz",
    "metrics/fcd_torch/ChemNet_v0.13_pretrained.pt"
]